<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой мессенджер</title>
  <style>
    /* Стили оставь те же, что были — они не вызывают ошибок */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e2f; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .chat-container { width: 100%; max-width: 500px; height: 90vh; background: #2a2a3c; border-radius: 16px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; }
    .chat-header { background: #3a3a4f; padding: 16px; text-align: center; color: #fff; font-size: 20px; font-weight: bold; }
    #messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 18px; word-wrap: break-word; animation: fadeIn 0.2s ease; }
    .msg.mine { align-self: flex-end; background: #4f6ef7; color: white; }
    .msg.other { align-self: flex-start; background: #3e3e55; color: #e0e0e0; }
    .msg .author { font-size: 0.75rem; opacity: 0.7; margin-bottom: 4px; }
    .msg .text { font-size: 1rem; }
    .input-area { display: flex; padding: 12px; background: #2a2a3c; border-top: 1px solid #3e3e55; }
    .input-area input[type="text"] { flex: 1; padding: 12px 16px; border: none; border-radius: 24px; background: #3a3a4f; color: #fff; font-size: 16px; outline: none; }
    .input-area input[type="text"]::placeholder { color: #aaa; }
    .input-area button { margin-left: 10px; padding: 12px 20px; border: none; border-radius: 24px; background: #4f6ef7; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
    .name-modal { position: fixed; top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;justify-content:center;align-items:center; }
    .name-modal > div { background: #2a2a3c; padding: 24px; border-radius: 16px; text-align: center; color: white; }
    .name-modal input { padding: 10px; border-radius: 8px; border: none; margin: 12px 0; width: 80%; }
    .name-modal button { padding: 10px 24px; border: none; border-radius: 8px; background: #4f6ef7; color: white; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div id="namePrompt" class="name-modal">
    <div>
      <h3>Как тебя зовут?</h3>
      <input type="text" id="nameInput" placeholder="Твоё имя" maxlength="20" />
      <br/>
      <button onclick="setName()">Войти в чат</button>
    </div>
  </div>

  <div class="chat-container">
    <div class="chat-header">💬 Общий чат</div>
    <div id="messages"></div>
    <div class="input-area">
      <input type="text" id="messageInput" placeholder="Введи сообщение..." maxlength="500" />
      <button onclick="sendMessage()">➤</button>
    </div>
  </div>

  <!-- Supabase JS client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // ⚠️ ЗАМЕНИ НА СВОИ КЛЮЧИ
    const SUPABASE_URL = "https://zgvpyypckstbefcoyrzk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_PVxpuNJpjdmPgBL6_Kna_A_O9KnYxX6";

    // Инициализация Supabase (ТОЛЬКО ОДИН РАЗ)
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const messagesDiv = document.getElementById("messages");
    const messageInput = document.getElementById("messageInput");
    const namePrompt = document.getElementById("namePrompt");
    const nameInput = document.getElementById("nameInput");

    let myName = localStorage.getItem("chat_name") || "";

    if (myName) {
      namePrompt.style.display = "none";
      nameInput.value = myName;
    }

    window.setName = function() {
      const name = nameInput.value.trim();
      if (name.length === 0) return;
      myName = name;
      localStorage.setItem("chat_name", myName);
      namePrompt.style.display = "none";
      loadMessages();
    };

    window.sendMessage = async function() {
      if (!myName) {
        alert("Сначала введи имя!");
        return;
      }
      const text = messageInput.value.trim();
      if (text === "") return;

      const { error } = await supabase
        .from("messages")
        .insert([{ author: myName, text: text }]);

      if (error) {
        alert("Ошибка отправки: " + error.message);
        return;
      }
      messageInput.value = "";
    };

    messageInput.addEventListener("keypress", function(e) {
      if (e.key === "Enter") sendMessage();
    });
    nameInput.addEventListener("keypress", function(e) {
      if (e.key === "Enter") setName();
    });

    async function loadMessages() {
      const { data, error } = await supabase
        .from("messages")
        .select("*")
        .order("created_at", { ascending: true })
        .limit(50);

      if (error) {
        console.error("Ошибка загрузки сообщений:", error);
        return;
      }

      messagesDiv.innerHTML = "";
      if (data) {
        data.forEach(msg => displayMessage(msg.author, msg.text));
      }

      supabase
        .channel("public:messages")
        .on("postgres_changes", {
          event: "INSERT",
          schema: "public",
          table: "messages"
        }, (payload) => {
          const msg = payload.new;
          displayMessage(msg.author, msg.text);
        })
        .subscribe();
    }

    function displayMessage(author, text) {
      const div = document.createElement("div");
      div.className = "msg " + (author === myName ? "mine" : "other");
      div.innerHTML = `
        <div class="author">${escapeHtml(author)}</div>
        <div class="text">${escapeHtml(text)}</div>
      `;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    // Если имя уже сохранено, загружаем сообщения сразу
    if (myName) {
      loadMessages();
    }
  </script>
</body>
</html>
