<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Общий чат</title>
  <link rel="manifest" href="/supa-chat/manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #1e1e2f; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .chat-container { width: 100%; max-width: 600px; height: 100%; margin: 0 auto; background: #2a2a3c; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    .chat-header { background: #3a3a4f; padding: 16px; text-align: center; color: #fff; font-size: 20px; font-weight: bold; flex-shrink: 0; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 80px; display: flex; flex-direction: column; gap: 6px; }
    .msg { max-width: 80%; padding: 8px 12px; border-radius: 18px; word-wrap: break-word; animation: fadeIn 0.2s ease; }
    .msg.mine { align-self: flex-end; background: #4f6ef7; color: white; border-bottom-right-radius: 4px; }
    .msg.other { align-self: flex-start; background: #3e3e55; color: #e0e0e0; border-bottom-left-radius: 4px; }
    .msg .author { font-size: 0.75rem; opacity: 0.8; margin-bottom: 2px; }
    .msg .text { font-size: 1rem; margin-bottom: 2px; }
    .msg .time { font-size: 0.65rem; opacity: 0.7; text-align: right; }
    .msg img { max-width: 200px; max-height: 200px; border-radius: 12px; margin-top: 4px; cursor: pointer; }
    .input-area { position: sticky; bottom: 0; width: 100%; background: #2a2a3c; border-top: 1px solid #3e3e55; padding: 8px 12px; display: flex; gap: 8px; flex-shrink: 0; z-index: 10; align-items: center; }
    .input-area input[type="text"] { flex: 1; padding: 12px 16px; border: none; border-radius: 24px; background: #3a3a4f; color: #fff; font-size: 16px; outline: none; }
    .input-area input[type="text"]::placeholder { color: #aaa; }
    .input-area button { padding: 12px 16px; border: none; border-radius: 24px; background: #4f6ef7; color: white; font-weight: bold; font-size: 16px; cursor: pointer; white-space: nowrap; }
    .attach-btn { background: #3a3a4f !important; font-size: 20px; padding: 12px 14px !important; }
    .name-prompt { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 100; }
    .name-prompt > div { background: #2a2a3c; padding: 24px; border-radius: 16px; text-align: center; color: white; }
    .name-prompt input { padding: 10px; border-radius: 8px; border: none; margin: 12px 0; width: 80%; }
    .name-prompt button { padding: 10px 24px; border: none; border-radius: 8px; background: #4f6ef7; color: white; font-weight: bold; cursor: pointer; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 600px) {
      .input-area {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        max-width: 600px;
        width: 100%;
      }
      #messages { padding-bottom: 80px; }
    }
  </style>
</head>
<body>
  <!-- Ввод имени -->
  <div id="namePrompt" class="name-prompt">
    <div>
      <h3>Как тебя зовут?</h3>
      <input type="text" id="nameInput" placeholder="Твоё имя" maxlength="20" />
      <br/>
      <button onclick="setName()">Войти в чат</button>
    </div>
  </div>

  <!-- Сам чат -->
  <div class="chat-container" id="chatApp" style="display:none;">
    <div class="chat-header">💬 Общий чат</div>
    <div id="messages"></div>
    <div class="input-area">
      <input type="text" id="messageInput" placeholder="Сообщение..." maxlength="500" />
      <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFileSelect(event)" />
      <button class="attach-btn" onclick="document.getElementById('fileInput').click()">📷</button>
      <button onclick="sendMessage()">➤</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ⚠️ Твои ключи Supabase
    const SUPABASE_URL = "https://zgvpyypckstbefcoyrzk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_PVxpuNJpjdmPgBL6_Kna_A_O9KnYxX6";

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const namePrompt = document.getElementById("namePrompt");
    const nameInput = document.getElementById("nameInput");
    const chatApp = document.getElementById("chatApp");
    const messagesDiv = document.getElementById("messages");
    const messageInput = document.getElementById("messageInput");
    const fileInput = document.getElementById("fileInput");

    let myName = localStorage.getItem("chat_name") || "";
    let selectedFile = null;

    // Если имя уже сохранено, сразу показываем чат
    if (myName) {
      namePrompt.style.display = "none";
      chatApp.style.display = "flex";
      loadHistoryAndSubscribe();
    } else {
      namePrompt.style.display = "flex";
    }

    // Установка имени
    window.setName = function() {
      const name = nameInput.value.trim();
      if (!name) return;
      myName = name;
      localStorage.setItem("chat_name", myName);
      namePrompt.style.display = "none";
      chatApp.style.display = "flex";
      loadHistoryAndSubscribe();
    };

    // Загрузка истории и подписка на новые сообщения
    async function loadHistoryAndSubscribe() {
      // Загружаем последние 50 сообщений
      const { data, error } = await supabase
        .from("chat_messages")
        .select("*")
        .order("created_at", { ascending: true })
        .limit(50);

      if (error) {
        console.error("Ошибка загрузки истории:", error);
        return;
      }
      messagesDiv.innerHTML = "";
      if (data) data.forEach(msg => displayMessage(msg));

      // Подписка на новые
      supabase
        .channel("public:chat_messages")
        .on("postgres_changes", {
          event: "INSERT",
          schema: "public",
          table: "chat_messages"
        }, payload => {
          displayMessage(payload.new);
        })
        .subscribe();
    }

    // Отображение сообщения
    function displayMessage(msg) {
      const div = document.createElement("div");
      div.className = "msg " + (msg.author === myName ? "mine" : "other");
      const time = msg.created_at
        ? new Date(msg.created_at).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" })
        : "";
      let content = "";
      if (msg.author !== myName) {
        content += `<div class="author">${escapeHtml(msg.author)}</div>`;
      }
      content += `<div class="text">${escapeHtml(msg.text || "")}</div>`;
      if (msg.image_url) {
        content += `<img src="${escapeHtml(msg.image_url)}" loading="lazy" onclick="window.open(this.src)" />`;
      }
      content += `<div class="time">${time}</div>`;
      div.innerHTML = content;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // Выбор файла
    window.handleFileSelect = function(event) {
      if (event.target.files.length > 0) {
        selectedFile = event.target.files[0];
        messageInput.placeholder = "Фото выбрано, введите подпись (или оставьте пустым)";
      }
    };

    // Отправка сообщения
    window.sendMessage = async function() {
      if (!myName) return;
      const text = messageInput.value.trim();
      if (!text && !selectedFile) return;

      let imageUrl = null;
      if (selectedFile) {
        const fileName = `${Date.now()}-${selectedFile.name}`;
        const { error: uploadError } = await supabase.storage
          .from("chat-images")
          .upload(fileName, selectedFile);
        if (uploadError) {
          alert("Ошибка загрузки фото: " + uploadError.message);
          return;
        }
        const { data: publicData } = supabase.storage.from("chat-images").getPublicUrl(fileName);
        imageUrl = publicData.publicUrl;
        selectedFile = null;
        fileInput.value = "";
        messageInput.placeholder = "Сообщение...";
      }

      const { error } = await supabase
        .from("chat_messages")
        .insert([{ author: myName, text: text || "", image_url: imageUrl }]);

      if (error) {
        alert("Ошибка отправки: " + error.message);
        return;
      }
      messageInput.value = "";
    };

    // Enter в поле сообщения
    messageInput.addEventListener("keypress", e => {
      if (e.key === "Enter") sendMessage();
    });
    nameInput.addEventListener("keypress", e => {
      if (e.key === "Enter") setName();
    });

    // Экранирование
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML;
    }

    // Адаптация под мобильную клавиатуру
    if (window.visualViewport) {
      const inputArea = document.querySelector(".input-area");
      window.visualViewport.addEventListener("resize", () => {
        const vp = window.visualViewport;
        if (inputArea.style.position === "fixed") {
          inputArea.style.bottom = (window.innerHeight - vp.height - vp.offsetTop) + "px";
        }
      });
      messageInput.addEventListener("focus", () => {
        setTimeout(() => {
          messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }, 300);
      });
    }
  </script>
</body>
</html>
