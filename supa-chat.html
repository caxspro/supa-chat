<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой мессенджер</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e2f; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .messenger { width: 100%; max-width: 900px; height: 90vh; background: #2a2a3c; border-radius: 16px; display: flex; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; }
    .sidebar { width: 320px; background: #232334; display: flex; flex-direction: column; border-right: 1px solid #3e3e55; }
    .search-box { padding: 16px; border-bottom: 1px solid #3e3e55; }
    .search-box input { width: 100%; padding: 10px 14px; border: none; border-radius: 24px; background: #3a3a4f; color: #fff; font-size: 14px; outline: none; }
    .search-box input::placeholder { color: #aaa; }
    .contacts-list { flex: 1; overflow-y: auto; padding: 8px; }
    .contact { padding: 12px 16px; border-radius: 12px; cursor: pointer; color: #e0e0e0; margin-bottom: 2px; transition: background 0.2s; display: flex; align-items: center; position: relative; }
    .contact:hover { background: #3a3a4f; }
    .contact.active { background: #4f6ef7; color: white; }
    .contact .name { font-weight: 500; }
    .contact .badge { position: absolute; right: 12px; background: #f77; color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; display: flex; align-items: center; justify-content: center; }
    .no-contacts { text-align: center; color: #aaa; margin-top: 40px; font-size: 14px; }
    .chat-panel { flex: 1; display: flex; flex-direction: column; }
    .chat-header { background: #3a3a4f; padding: 16px; color: #fff; font-size: 18px; font-weight: bold; text-align: center; border-bottom: 1px solid #3e3e55; }
    #messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 70%; padding: 10px 14px; border-radius: 18px; word-wrap: break-word; animation: fadeIn 0.2s ease; }
    .msg.mine { align-self: flex-end; background: #4f6ef7; color: white; }
    .msg.other { align-self: flex-start; background: #3e3e55; color: #e0e0e0; }
    .msg .text { font-size: 1rem; }
    .input-area { display: flex; padding: 12px; background: #2a2a3c; border-top: 1px solid #3e3e55; }
    .input-area input[type="text"] { flex: 1; padding: 12px 16px; border: none; border-radius: 24px; background: #3a3a4f; color: #fff; font-size: 16px; outline: none; }
    .input-area input[type="text"]::placeholder { color: #aaa; }
    .input-area button { margin-left: 10px; padding: 12px 20px; border: none; border-radius: 24px; background: #4f6ef7; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
    .name-modal { position: fixed; top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:flex;justify-content:center;align-items:center;z-index:100; }
    .name-modal > div { background: #2a2a3c; padding: 24px; border-radius: 16px; text-align: center; color: white; }
    .name-modal input { padding: 10px; border-radius: 8px; border: none; margin: 12px 0; width: 80%; }
    .name-modal button { padding: 10px 24px; border: none; border-radius: 8px; background: #4f6ef7; color: white; font-weight: bold; cursor: pointer; }
    .error-text { color: #f77; font-size: 14px; margin-top: 4px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 600px) { .messenger { flex-direction: column; } .sidebar { width: 100%; height: 40%; } }
  </style>
</head>
<body>
  <!-- Окно ввода имени -->
  <div id="namePrompt" class="name-modal">
    <div>
      <h3>Придумай уникальное имя</h3>
      <input type="text" id="nameInput" placeholder="Твоё имя" maxlength="20" />
      <div id="nameError" class="error-text"></div>
      <br/>
      <button onclick="registerName()">Войти</button>
    </div>
  </div>

  <div class="messenger" id="messengerApp" style="display:none;">
    <!-- Боковая панель -->
    <div class="sidebar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Поиск людей..." oninput="searchUsers()" />
      </div>
      <div class="contacts-list" id="contactsList">
        <div class="no-contacts">Здесь появятся контакты</div>
      </div>
    </div>

    <!-- Окно чата -->
    <div class="chat-panel" id="chatPanel">
      <div class="chat-header" id="chatHeader">💬 Выберите собеседника</div>
      <div id="messages"></div>
      <div class="input-area" id="inputArea" style="display:none;">
        <input type="text" id="messageInput" placeholder="Введи сообщение..." maxlength="500" />
        <button onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // ⚠️ ТВОИ КЛЮЧИ
    const SUPABASE_URL = "https://zgvpyypckstbefcoyrzk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_PVxpuNJpjdmPgBL6_Kna_A_O9KnYxX6";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // DOM элементы
    const namePrompt = document.getElementById("namePrompt");
    const nameInput = document.getElementById("nameInput");
    const nameError = document.getElementById("nameError");
    const messengerApp = document.getElementById("messengerApp");
    const contactsList = document.getElementById("contactsList");
    const searchInput = document.getElementById("searchInput");
    const chatHeader = document.getElementById("chatHeader");
    const messagesDiv = document.getElementById("messages");
    const messageInput = document.getElementById("messageInput");
    const inputArea = document.getElementById("inputArea");

    let myName = localStorage.getItem("chat_name") || "";
    let currentRecipient = null; // имя собеседника, с которым открыт чат
    let knownContacts = new Set(); // имена, с которыми уже была переписка
    let unreadCounts = {}; // { имя: количество непрочитанных }

    // Глобальный канал realtime (активен всегда после входа)
    let globalChannel = null;

    // Если имя уже сохранено в localStorage, пробуем восстановить сессию
    if (myName) {
      checkNameExists(myName).then(exists => {
        if (exists) {
          showMessenger();
        } else {
          localStorage.removeItem("chat_name");
          myName = "";
          namePrompt.style.display = "flex";
        }
      });
    } else {
      namePrompt.style.display = "flex";
    }

    // Регистрация имени
    window.registerName = async function() {
      const name = nameInput.value.trim();
      if (name.length === 0) return;

      const { data, error } = await supabaseClient
        .from("users")
        .select("name")
        .eq("name", name)
        .maybeSingle();

      if (error) {
        nameError.textContent = "Ошибка проверки имени";
        return;
      }

      if (data) {
        nameError.textContent = "Это имя уже занято. Выбери другое.";
        return;
      }

      const { error: insertError } = await supabaseClient
        .from("users")
        .insert([{ name: name }]);

      if (insertError) {
        nameError.textContent = "Ошибка регистрации: " + insertError.message;
        return;
      }

      myName = name;
      localStorage.setItem("chat_name", myName);
      namePrompt.style.display = "none";
      showMessenger();
    };

    async function checkNameExists(name) {
      const { data } = await supabaseClient
        .from("users")
        .select("name")
        .eq("name", name)
        .maybeSingle();
      return !!data;
    }

    // Показать интерфейс мессенджера и запустить глобальный слушатель
    function showMessenger() {
      namePrompt.style.display = "none";
      messengerApp.style.display = "flex";
      loadContactsFromHistory();
      startGlobalListener();
    }

    // Загружаем контакты, с которыми уже общались
    async function loadContactsFromHistory() {
      if (!myName) return;
      const { data, error } = await supabaseClient
        .from("private_messages")
        .select("sender_name, recipient_name")
        .or(`sender_name.eq.${myName},recipient_name.eq.${myName}`);

      if (error) {
        console.error(error);
        renderContactList([]);
        return;
      }

      const contactSet = new Set();
      data.forEach(msg => {
        if (msg.sender_name !== myName) contactSet.add(msg.sender_name);
        if (msg.recipient_name !== myName) contactSet.add(msg.recipient_name);
      });
      knownContacts = new Set(contactSet);
      renderContactList(Array.from(contactSet));
    }

    function renderContactList(names) {
      contactsList.innerHTML = "";
      if (names.length === 0) {
        contactsList.innerHTML = `<div class="no-contacts">Нет контактов. Воспользуйтесь поиском.</div>`;
        return;
      }

      names.forEach(name => {
        const div = document.createElement("div");
        div.className = "contact" + (name === currentRecipient ? " active" : "");
        let badgeHTML = "";
        if (unreadCounts[name] && unreadCounts[name] > 0) {
          badgeHTML = `<span class="badge">${unreadCounts[name]}</span>`;
        }
        div.innerHTML = `<span class="name">${escapeHtml(name)}</span>${badgeHTML}`;
        div.onclick = () => openChat(name);
        contactsList.appendChild(div);
      });
    }

    // Глобальный слушатель новых сообщений (работает всегда)
    function startGlobalListener() {
      if (globalChannel) {
        supabaseClient.removeChannel(globalChannel);
      }

      globalChannel = supabaseClient
        .channel("global-private-changes")
        .on("postgres_changes", {
          event: "INSERT",
          schema: "public",
          table: "private_messages"
        }, (payload) => {
          const msg = payload.new;
          // Сообщение адресовано мне или я отправитель
          if (msg.recipient_name === myName || msg.sender_name === myName) {
            const otherParty = msg.sender_name === myName ? msg.recipient_name : msg.sender_name;

            // Добавляем контакт, если его ещё нет
            if (!knownContacts.has(otherParty)) {
              knownContacts.add(otherParty);
              renderContactList(Array.from(knownContacts));
            }

            // Если сейчас открыт чат с этим человеком, показываем сообщение
            if (currentRecipient === otherParty) {
              displayMessage(msg.sender_name, msg.text);
            } else if (msg.recipient_name === myName) {
              // Увеличиваем счётчик непрочитанных
              unreadCounts[otherParty] = (unreadCounts[otherParty] || 0) + 1;
              renderContactList(Array.from(knownContacts));
            }
          }
        })
        .subscribe();
    }

    // Поиск людей
    window.searchUsers = async function() {
      const query = searchInput.value.trim();
      if (query.length === 0) {
        renderContactList(Array.from(knownContacts));
        return;
      }

      const { data, error } = await supabaseClient
        .from("users")
        .select("name")
        .ilike("name", `%${query}%`)
        .limit(20);

      if (error) {
        console.error(error);
        return;
      }

      const resultNames = data ? data.map(u => u.name) : [];
      renderContactList(resultNames);
    };

    // Открыть чат с пользователем
    async function openChat(recipientName) {
      if (recipientName === myName) return;
      currentRecipient = recipientName;
      // Сбрасываем непрочитанные
      unreadCounts[recipientName] = 0;
      chatHeader.textContent = `💬 ${recipientName}`;
      inputArea.style.display = "flex";
      messagesDiv.innerHTML = "";

      // Загружаем историю
      const { data, error } = await supabaseClient
        .from("private_messages")
        .select("*")
        .or(`sender_name.eq.${myName},recipient_name.eq.${myName}`)
        .order("created_at", { ascending: true });

      if (error) {
        console.error(error);
        return;
      }

      const relevant = data.filter(msg =>
        (msg.sender_name === myName && msg.recipient_name === recipientName) ||
        (msg.sender_name === recipientName && msg.recipient_name === myName)
      );

      relevant.forEach(msg => displayMessage(msg.sender_name, msg.text));
      messagesDiv.scrollTop = messagesDiv.scrollHeight;

      // Обновляем список контактов (убираем бейдж)
      if (searchInput.value.trim() === "") {
        renderContactList(Array.from(knownContacts));
      } else {
        searchUsers();
      }
    }

    function displayMessage(sender, text) {
      const div = document.createElement("div");
      div.className = "msg " + (sender === myName ? "mine" : "other");
      div.innerHTML = `<div class="text">${escapeHtml(text)}</div>`;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // Отправка сообщения
    window.sendMessage = async function() {
      if (!myName || !currentRecipient) {
        alert("Сначала выберите собеседника в списке слева.");
        return;
      }
      const text = messageInput.value.trim();
      if (text === "") return;

      const { error } = await supabaseClient
        .from("private_messages")
        .insert([{
          sender_name: myName,
          recipient_name: currentRecipient,
          text: text
        }]);

      if (error) {
        alert("Ошибка отправки: " + error.message);
        console.error(error);
        return;
      }
      messageInput.value = "";
      // Сообщение появится через глобальный слушатель (или почти мгновенно)
    };

    // Enter в поле ввода сообщения
    messageInput.addEventListener("keypress", function(e) {
      if (e.key === "Enter") sendMessage();
    });
    // Enter в поле ввода имени
    nameInput.addEventListener("keypress", function(e) {
      if (e.key === "Enter") registerName();
    });

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
