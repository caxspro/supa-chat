<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Мой мессенджер</title>
  <link rel="manifest" href="/supa-chat/manifest.json">
  
  <!-- OneSignal SDK -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(function(OneSignal) {
      OneSignal.init({
        appId: "ВАШ_ONESIGNAL_APP_ID", // ⚠️ замени на свой App ID
        notifyButton: { enable: false }, // убираем колокольчик
        allowLocalhostAsSecureOrigin: true,
      });
    });
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; background: #1e1e2f; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .messenger { width: 100%; max-width: 900px; height: 100%; background: #2a2a3c; border-radius: 16px; display: flex; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; margin: 0 auto; }
    .sidebar { width: 320px; background: #232334; display: flex; flex-direction: column; border-right: 1px solid #3e3e55; height: 100%; flex-shrink: 0; }
    .search-box { padding: 16px; border-bottom: 1px solid #3e3e55; }
    .search-box input { width: 100%; padding: 10px 14px; border: none; border-radius: 24px; background: #3a3a4f; color: #fff; font-size: 14px; outline: none; }
    .search-box input::placeholder { color: #aaa; }
    .contacts-list { flex: 1; overflow-y: auto; padding: 8px; }
    .contact { padding: 12px 16px; border-radius: 12px; cursor: pointer; color: #e0e0e0; margin-bottom: 2px; transition: background 0.2s; display: flex; align-items: center; position: relative; }
    .contact:hover { background: #3a3a4f; }
    .contact.active { background: #4f6ef7; color: white; }
    .contact .name { font-weight: 500; flex: 1; }
    .contact .online-dot { width: 8px; height: 8px; border-radius: 50%; background: #888; margin-right: 8px; flex-shrink: 0; }
    .contact .online-dot.online { background: #4f8; }
    .contact .badge { margin-left: 8px; background: #f77; color: white; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; display: flex; align-items: center; justify-content: center; }
    .no-contacts { text-align: center; color: #aaa; margin-top: 40px; font-size: 14px; }
    .chat-panel { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; }
    .chat-header { background: #3a3a4f; padding: 16px; color: #fff; font-size: 18px; font-weight: bold; text-align: center; border-bottom: 1px solid #3e3e55; flex-shrink: 0; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 80px; display: flex; flex-direction: column; gap: 6px; }
    .msg { max-width: 70%; padding: 8px 12px; border-radius: 18px; word-wrap: break-word; animation: fadeIn 0.2s ease; position: relative; }
    .msg.mine { align-self: flex-end; background: #4f6ef7; color: white; border-bottom-right-radius: 4px; }
    .msg.other { align-self: flex-start; background: #3e3e55; color: #e0e0e0; border-bottom-left-radius: 4px; }
    .msg .text { font-size: 1rem; margin-bottom: 2px; }
    .msg .time { font-size: 0.65rem; opacity: 0.7; text-align: right; }
    .msg img { max-width: 200px; max-height: 200px; border-radius: 12px; margin-top: 4px; cursor: pointer; }
    .input-area { position: sticky; bottom: 0; width: 100%; background: #2a2a3c; border-top: 1px solid #3e3e55; padding: 8px 12px; display: flex; gap: 8px; flex-shrink: 0; z-index: 10; align-items: center; }
    .input-area input[type="text"] { flex: 1; padding: 12px 16px; border: none; border-radius: 24px; background: #3a3a4f; color: #fff; font-size: 16px; outline: none; }
    .input-area input[type="text"]::placeholder { color: #aaa; }
    .input-area button { padding: 12px 16px; border: none; border-radius: 24px; background: #4f6ef7; color: white; font-weight: bold; font-size: 16px; cursor: pointer; white-space: nowrap; }
    .attach-btn { background: #3a3a4f !important; font-size: 20px; padding: 12px 14px !important; }
    .name-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 100; }
    .name-modal > div { background: #2a2a3c; padding: 24px; border-radius: 16px; text-align: center; color: white; }
    .name-modal input { padding: 10px; border-radius: 8px; border: none; margin: 12px 0; width: 80%; }
    .name-modal button { padding: 10px 24px; border: none; border-radius: 8px; background: #4f6ef7; color: white; font-weight: bold; cursor: pointer; }
    .error-text { color: #f77; font-size: 14px; margin-top: 4px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 600px) {
      .messenger { flex-direction: column; height: 100%; border-radius: 0; }
      .sidebar { width: 100%; height: 40%; border-right: none; border-bottom: 1px solid #3e3e55; }
      .chat-panel { height: 60%; }
      .input-area { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); max-width: 600px; width: 100%; }
    }
  </style>
</head>
<body>
  <!-- Окно ввода имени -->
  <div id="namePrompt" class="name-modal">
    <div>
      <h3>Придумай уникальное имя</h3>
      <input type="text" id="nameInput" placeholder="Твоё имя" maxlength="20" />
      <div id="nameError" class="error-text"></div>
      <br/>
      <button onclick="registerName()">Войти</button>
    </div>
  </div>

  <div class="messenger" id="messengerApp" style="display:none;">
    <div class="sidebar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Поиск людей..." oninput="searchUsers()" />
      </div>
      <div class="contacts-list" id="contactsList">
        <div class="no-contacts">Здесь появятся контакты</div>
      </div>
    </div>

    <div class="chat-panel">
      <div class="chat-header" id="chatHeader">💬 Выберите собеседника</div>
      <div id="messages"></div>
      <div class="input-area" id="inputArea" style="display:none;">
        <input type="text" id="messageInput" placeholder="Сообщение..." maxlength="500" />
        <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleFileSelect(event)" />
        <button class="attach-btn" onclick="document.getElementById('fileInput').click()" title="Прикрепить фото">📷</button>
        <button onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>

  <!-- Остальной JavaScript (Supabase и чат) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ⚠️ ТВОИ КЛЮЧИ SUPABASE
    const SUPABASE_URL = "https://zgvpyypckstbefcoyrzk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_PVxpuNJpjdmPgBL6_Kna_A_O9KnYxX6";
    const ONESIGNAL_APP_ID = "5c42a8d3-d68c-41b9-82d7-8216101f0e5e"; // ⚠️ замени
    const ONESIGNAL_REST_API_KEY = "os_v2_app_lrbkru6wrra3tawxqilbahyol2srvmpqhebuesfxnxjwribqpsgtcgzdcbcznejrs6jyykj5earyttc2hos3o7kli2ij7gibw57b4fy"; // ⚠️ замени

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // DOM элементы
    const namePrompt = document.getElementById("namePrompt");
    const nameInput = document.getElementById("nameInput");
    const nameError = document.getElementById("nameError");
    const messengerApp = document.getElementById("messengerApp");
    const contactsList = document.getElementById("contactsList");
    const searchInput = document.getElementById("searchInput");
    const chatHeader = document.getElementById("chatHeader");
    const messagesDiv = document.getElementById("messages");
    const messageInput = document.getElementById("messageInput");
    const fileInput = document.getElementById("fileInput");
    const inputArea = document.getElementById("inputArea");

    let myName = localStorage.getItem("chat_name") || "";
    let currentRecipient = null;
    let knownContacts = new Set();
    let unreadCounts = {};
    let onlineUsers = new Set();
    let selectedFile = null;

    // Восстановление сессии
    if (myName) {
      checkNameExists(myName).then(exists => {
        if (exists) showMessenger();
        else { localStorage.removeItem("chat_name"); myName = ""; namePrompt.style.display = "flex"; }
      });
    } else {
      namePrompt.style.display = "flex";
    }

    window.registerName = async function() {
      const name = nameInput.value.trim();
      if (!name) return;
      const { data } = await supabaseClient.from("users").select("name").eq("name", name).maybeSingle();
      if (data) { nameError.textContent = "Имя занято"; return; }
      const { error } = await supabaseClient.from("users").insert([{ name }]);
      if (error) { nameError.textContent = "Ошибка"; return; }
      myName = name;
      localStorage.setItem("chat_name", myName);
      namePrompt.style.display = "none";
      showMessenger();
    };

    async function checkNameExists(name) {
      const { data } = await supabaseClient.from("users").select("name").eq("name", name).maybeSingle();
      return !!data;
    }

    function showMessenger() {
      namePrompt.style.display = "none";
      messengerApp.style.display = "flex";
      loadContactsFromHistory();
      startGlobalListener();
      startPresence();
      savePlayerId(); // сохраняем OneSignal player ID
    }

    // Сохраняем OneSignal player ID в базу
    async function savePlayerId() {
      if (!myName) return;
      OneSignalDeferred.push(function(OneSignal) {
        OneSignal.getUserId().then(playerId => {
          if (playerId) {
            supabaseClient.from("users").update({ push_subscription: playerId }).eq("name", myName);
          }
        });
      });
    }

    // Присутствие (realtime presence) – без изменений
    async function startPresence() {
      const presenceChannel = supabaseClient.channel("online-users", {
        config: { presence: { key: myName } }
      });
      presenceChannel.on("presence", { event: "sync" }, () => {
        const newOnline = new Set();
        const state = presenceChannel.presenceState();
        for (const id in state) {
          state[id].forEach(p => newOnline.add(p.key));
        }
        onlineUsers = newOnline;
        renderContactList(Array.from(knownContacts));
      }).subscribe(async (status) => {
        if (status === "SUBSCRIBED") {
          await presenceChannel.track({ key: myName });
        }
      });
    }

    async function loadContactsFromHistory() { /* без изменений */ }
    function renderContactList(names) { /* без изменений, с точками онлайн */ }

    function startGlobalListener() {
      if (window.globalChannel) supabaseClient.removeChannel(window.globalChannel);
      window.globalChannel = supabaseClient.channel("global-msgs")
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "private_messages" }, payload => {
          const msg = payload.new;
          if (msg.recipient_name !== myName && msg.sender_name !== myName) return;
          const other = msg.sender_name === myName ? msg.recipient_name : msg.sender_name;
          if (!knownContacts.has(other)) {
            knownContacts.add(other);
            renderContactList(Array.from(knownContacts));
          }
          if (currentRecipient === other) {
            displayMessage(msg);
          } else if (msg.recipient_name === myName) {
            unreadCounts[other] = (unreadCounts[other] || 0) + 1;
            renderContactList(Array.from(knownContacts));
          }
        })
        .subscribe();
    }

    async function openChat(name) { /* без изменений */ }
    function displayMessage(msg) { /* без изменений */ }

    // Отправка сообщения
    window.sendMessage = async function() {
      if (!myName || !currentRecipient) { alert("Выберите собеседника"); return; }
      const text = messageInput.value.trim();
      if (!text && !selectedFile) return;

      let imageUrl = null;
      if (selectedFile) {
        const fileName = `${Date.now()}-${selectedFile.name}`;
        const { error: uploadError } = await supabaseClient.storage.from("chat-images").upload(fileName, selectedFile);
        if (uploadError) { alert("Ошибка загрузки фото: " + uploadError.message); return; }
        const { data: publicData } = supabaseClient.storage.from("chat-images").getPublicUrl(fileName);
        imageUrl = publicData.publicUrl;
        selectedFile = null;
        fileInput.value = "";
      }

      const { error } = await supabaseClient.from("private_messages").insert([{
        sender_name: myName,
        recipient_name: currentRecipient,
        text: text || "",
        image_url: imageUrl
      }]);
      if (error) { alert("Ошибка отправки: " + error.message); return; }

      messageInput.value = "";
      messageInput.placeholder = "Сообщение...";

      // Отправляем push через OneSignal
      sendOneSignalPush(currentRecipient, myName, text || "[Фото]");
    };

    async function sendOneSignalPush(recipientName, senderName, messageText) {
      // Получаем player_id получателя из базы
      const { data, error } = await supabaseClient
        .from("users")
        .select("push_subscription")
        .eq("name", recipientName)
        .single();
      if (error || !data?.push_subscription) return;

      const playerId = data.push_subscription;
      // Отправляем уведомление через OneSignal REST API
      await fetch("https://onesignal.com/api/v1/notifications", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Basic " + ONESIGNAL_REST_API_KEY
        },
        body: JSON.stringify({
          app_id: ONESIGNAL_APP_ID,
          include_player_ids: [playerId],
          headings: { en: senderName },
          contents: { en: messageText },
          url: "https://caxspro.github.io/supa-chat/supa-chat.html" // при клике откроется чат
        })
      }).catch(console.error);
    }

    window.handleFileSelect = function(event) { /* без изменений */ };
    window.searchUsers = async function() { /* без изменений */ };

    // Enter
    messageInput.addEventListener("keypress", e => { if (e.key === "Enter") sendMessage(); });
    nameInput.addEventListener("keypress", e => { if (e.key === "Enter") registerName(); });

    function escapeHtml(str) { /* без изменений */ }

    // Адаптация под клавиатуру
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", () => {
        const vp = window.visualViewport;
        if (inputArea.style.position === "fixed") {
          inputArea.style.bottom = (window.innerHeight - vp.height - vp.offsetTop) + "px";
        }
      });
      messageInput.addEventListener("focus", () => {
        setTimeout(() => messagesDiv.scrollTop = messagesDiv.scrollHeight, 300);
      });
    }
  </script>
</body>
</html>
